# SeekDB CI for GitHub-hosted runners (including fork repositories).
name: SeekDB CI

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [master, develop]
    paths-ignore:
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - 'README.md'
      - 'README_CN.md'
      - 'CONTRIBUTING.md'
  pull_request:
    branches: [master, develop]
    types: [opened, reopened, synchronize, ready_for_review]
    paths-ignore:
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - 'README.md'
      - 'README_CN.md'
      - 'CONTRIBUTING.md'

permissions:
  contents: read

concurrency:
  group: seekdb-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests and mysqltest
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Free disk space
        uses: insightsengineering/disk-space-reclaimer@v1
        with:
          tools-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
          docker-images: true

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y git wget curl rpm rpm2cpio cpio make build-essential binutils m4 libtool-bin libncurses5 python3 zstd

      - name: Cache build dependencies
        uses: actions/cache@v4
        with:
          path: deps/3rd
          key: ${{ runner.os }}-seekdb-deps-el9-x86_64-${{ hashFiles('deps/init/oceanbase.el9.x86_64.deps') }}

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Initialize SeekDB build
        shell: bash
        run: |
          set -euo pipefail
          ./build.sh release --init
          echo "$GITHUB_WORKSPACE/deps/3rd/usr/local/oceanbase/devtools/bin" >> "$GITHUB_PATH"

      - name: Build C++ unit tests
        shell: bash
        run: make -C build_release -j2 pretest

      - name: Run C++ unit tests
        shell: bash
        run: ./build_release/unittest/run_tests.sh --output-on-failure -j 2

      - name: Build SeekDB for mysqltest
        shell: bash
        run: make -C build_release -j2 seekdb

      - name: Run mysqltest
        shell: bash
        run: |
          set -euo pipefail
          CLIENT_ROOT="$GITHUB_WORKSPACE/deps/3rd/u01/obclient"
          TASK_DIR="$RUNNER_TEMP/seekdb-mysqltest"
          export PATH="$CLIENT_ROOT/bin:$PATH"
          export LD_LIBRARY_PATH="$CLIENT_ROOT/lib:$CLIENT_ROOT/lib64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          python3 .github/script/seekdb/mysqltest_for_seekdb.py run \
            --seekdb "$GITHUB_WORKSPACE/build_release/src/observer/seekdb" \
            --obclient "$CLIENT_ROOT/bin/obclient" \
            --mysqltest "$CLIENT_ROOT/bin/mysqltest" \
            --base-dir "$RUNNER_TEMP/seekdb-instance" \
            --work-dir "$TASK_DIR" \
            --port 2881 \
            --slice-index 0 \
            --slice-count 1

      - name: Upload mysqltest diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: seekdb-mysqltest-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/seekdb-mysqltest/
          if-no-files-found: ignore
          retention-days: 7
